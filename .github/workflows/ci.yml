name: MLflow Training CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn mlflow==2.19.0 joblib

      - name: Run mlflow project
        run: |
          mlflow run MLProject --no-conda

      - name: Get latest MLflow run_id
        run: |
          python -c "
          import mlflow
          client = mlflow.tracking.MlflowClient()
          experiment = client.get_experiment_by_name('House_Price_Prediction')
          if experiment:
              runs = client.search_runs(experiment_ids=[experiment.experiment_id])
              if runs:
                  print(f'LATEST_RUN_ID={runs[0].info.run_id}')
              else:
                  print('No runs found in experiment.')
          else:
              print('Experiment House_Price_Prediction not found.')
          "
